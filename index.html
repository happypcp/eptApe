    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "LexiScore",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "All",
            "description": "AI-powered English proficiency test preparation and mock examination platform for PTE Academic, PTE Core, IELTS Academic, IELTS General Training, and Duolingo English Test.",
            "offers": {
              "@type": "AggregateOffer",
              "lowPrice": "0",
              "highPrice": "199",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Which English proficiency exams does LexiScore support?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "LexiScore supports PTE Academic, PTE Core, IELTS Academic, IELTS General Training, and the Duolingo English Test (DET), each with independent task formats, timing rules, and scoring rubrics."
                }
              },
              {
                "@type": "Question",
                "name": "Are LexiScore AI scores official Pearson, IELTS, or Duolingo results?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. LexiScore provides transparent, rubric-aligned AI practice score estimates and diagnostic feedback designed to guide preparation. Official scores are issued solely by Pearson, IELTS partners, or Duolingo."
                }
              },
              {
                "@type": "Question",
                "name": "How does the AI speaking evaluation work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your browser records audio directly during speaking tasks. LexiScore transcribes your speech and evaluates pronunciation clarity, oral fluency, speaking pace, pauses, content relevance, grammar, and vocabulary against exam-specific rubrics."
                }
              }
            ]
          }
        ]
      }
    </script>
